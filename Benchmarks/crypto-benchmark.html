<!doctype html><meta charset="utf-8"><title>BP1 v1 vs v2 Crypto Benchmark</title><style>body{font-family:system-ui;max-width:800px;margin:50px auto;padding:20px;background:#111;color:#eee}button{padding:12px 18px;font-size:16px}pre{white-space:pre-wrap;background:#1c1c1c;padding:16px;border-radius:8px}</style><h1>BP1 Crypto Benchmark</h1><p>Measures only key-derivation overhead, without GitHub/network time. It compares 30 v1 PBKDF2 derivations against one v2 PBKDF2 plus 30 HKDF derivations.</p><button id="run">Run benchmark</button><pre id="out">Ready.</pre><script>
const enc=new TextEncoder(),ITER=250000,N=30,password='BP1-TEST-2026';
async function go(){run.disabled=true;out.textContent='Running...';const pk=await crypto.subtle.importKey('raw',enc.encode(password),'PBKDF2',false,['deriveBits','deriveKey']);let t=performance.now();for(let i=0;i<N;i++){const salt=crypto.getRandomValues(new Uint8Array(16));await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:ITER,hash:'SHA-256'},pk,{name:'AES-GCM',length:256},false,['decrypt'])}const v1=performance.now()-t;const salt=crypto.getRandomValues(new Uint8Array(16));t=performance.now();const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:ITER,hash:'SHA-256'},pk,256);const master=await crypto.subtle.importKey('raw',bits,'HKDF',false,['deriveKey']);const pb=performance.now()-t;t=performance.now();for(let i=0;i<N;i++)await crypto.subtle.deriveKey({name:'HKDF',hash:'SHA-256',salt,info:enc.encode('BP1v2:object-'+i)},master,{name:'AES-GCM',length:256},false,['decrypt']);const hk=performance.now()-t,v2=pb+hk;out.textContent=`Files: ${N}\n\nBP1 v1 KDF time: ${v1.toFixed(1)} ms\nBP1 v2 KDF time: ${v2.toFixed(1)} ms\n  PBKDF2 once: ${pb.toFixed(1)} ms\n  ${N} HKDF derivations: ${hk.toFixed(1)} ms\n\nKDF speedup: ${(v1/v2).toFixed(1)}×`;run.disabled=false}run.onclick=go;
</script>
