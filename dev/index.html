<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BP1 Dev Packager</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0d1117;color:#e6edf3;font-family:system-ui,sans-serif}.wrap{max-width:820px;margin:45px auto;padding:28px;background:#161b22;border:1px solid #30363d;border-radius:14px}h1{margin-top:0}p,.small{color:#8b949e;line-height:1.5}label{display:block;margin:18px 0 7px}input{width:100%;padding:12px;border:1px solid #30363d;border-radius:8px;background:#0d1117;color:#fff}button{width:100%;padding:12px;margin-top:18px;border:0;border-radius:8px;background:#238636;color:#fff;font-weight:700;cursor:pointer}button:disabled{opacity:.5}.status{margin-top:18px;padding:12px;white-space:pre-wrap;background:#0d1117;border:1px solid #30363d;border-radius:8px}</style></head>
<body><div class="wrap"><h1>BP1 Dev Packager</h1><p>Select a complete static website folder. The browser encrypts every file locally and produces a GitHub-ready BP1 ZIP.</p>
<label>Website name</label><input id="siteName" value="BP1 Test Site">
<label>BP1 key</label><input id="key" type="password" value="BP1-TEST-2026">
<label>Website folder</label><input id="folder" type="file" webkitdirectory multiple>
<button id="build">Build BP1 Package</button><div id="status" class="status">Ready.</div><div class="small">Expected source entry point: index.html at the selected folder root. Encryption: AES-256-GCM + PBKDF2-SHA-256, 250,000 iterations.</div></div>
<script>
'use strict';
const enc=new TextEncoder(),dec=new TextDecoder();const ITER=250000;const $=id=>document.getElementById(id);
function mime(path){const e=path.split('.').pop().toLowerCase();return ({html:'text/html; charset=utf-8',htm:'text/html; charset=utf-8',css:'text/css; charset=utf-8',js:'text/javascript; charset=utf-8',mjs:'text/javascript; charset=utf-8',json:'application/json; charset=utf-8',svg:'image/svg+xml',png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',gif:'image/gif',webp:'image/webp',ico:'image/x-icon',txt:'text/plain; charset=utf-8',xml:'application/xml',wasm:'application/wasm',mp3:'audio/mpeg',wav:'audio/wav',ogg:'audio/ogg',mp4:'video/mp4',webm:'video/webm',woff:'font/woff',woff2:'font/woff2',ttf:'font/ttf',otf:'font/otf',pdf:'application/pdf'})[e]||'application/octet-stream'}
function normalize(p){return p.replaceAll('\\','/').replace(/^\/+/, '').replace(/^\.\//,'')}
function hex(bytes){return [...bytes].map(b=>b.toString(16).padStart(2,'0')).join('')}
function randomName(){return hex(crypto.getRandomValues(new Uint8Array(16))).toUpperCase()+'.bp1'}
async function derive(password,salt){const pk=await crypto.subtle.importKey('raw',enc.encode(password),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:ITER,hash:'SHA-256'},pk,{name:'AES-GCM',length:256},false,['encrypt'])}
async function encrypt(data,password){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));const key=await derive(password,salt);const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,data));const out=new Uint8Array(33+ct.length);out.set(enc.encode('BP1E'),0);out[4]=1;out.set(salt,5);out.set(iv,21);out.set(ct,33);return out}
async function sha256(data){return hex(new Uint8Array(await crypto.subtle.digest('SHA-256',data)))}
function u16(n){return new Uint8Array([n&255,(n>>>8)&255])} function u32(n){return new Uint8Array([n&255,(n>>>8)&255,(n>>>16)&255,(n>>>24)&255])}
const crcTable=(()=>{let t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=(c&1)?0xedb88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(data){let c=0xffffffff;for(const b of data)c=crcTable[(c^b)&255]^(c>>>8);return (c^0xffffffff)>>>0}
function join(parts){let len=parts.reduce((n,p)=>n+p.length,0),out=new Uint8Array(len),o=0;for(const p of parts){out.set(p,o);o+=p.length}return out}
function zipStore(entries){const locals=[],centrals=[];let offset=0;for(const ent of entries){const name=enc.encode(ent.name),data=ent.data,crc=crc32(data);const local=join([u32(0x04034b50),u16(20),u16(0),u16(0),u16(0),u16(0),u32(crc),u32(data.length),u32(data.length),u16(name.length),u16(0),name,data]);locals.push(local);const central=join([u32(0x02014b50),u16(20),u16(20),u16(0),u16(0),u16(0),u16(0),u32(crc),u32(data.length),u32(data.length),u16(name.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(offset),name]);centrals.push(central);offset+=local.length}const cd=join(centrals),body=join(locals);const end=join([u32(0x06054b50),u16(0),u16(0),u16(entries.length),u16(entries.length),u32(cd.length),u32(body.length),u16(0)]);return join([body,cd,end])}
function sourcePath(file,root){let p=normalize(file.webkitRelativePath||file.name);if(root && p.startsWith(root+'/'))p=p.slice(root.length+1);return p}
$('build').onclick=async()=>{const files=[...$('folder').files],key=$('key').value,name=$('siteName').value.trim()||'BP1 Website',status=$('status'),btn=$('build');if(!files.length)return status.textContent='Select a website folder.';if(!key)return status.textContent='Enter a BP1 key.';const first=normalize(files[0].webkitRelativePath||'');const root=first.includes('/')?first.split('/')[0]:'';const paths=files.map(f=>sourcePath(f,root));if(!paths.includes('index.html'))return status.textContent='No root index.html was found in the selected folder.';btn.disabled=true;try{const manifest={bp1:1,name,version:1,entry:'index.html',algorithm:'AES-256-GCM',kdf:'PBKDF2-SHA-256',iterations:ITER,created:new Date().toISOString(),files:{}};const zip=[];for(let i=0;i<files.length;i++){const f=files[i],path=sourcePath(f,root);status.textContent=`Encrypting ${i+1}/${files.length}\n${path}`;if(!path||path.includes('..'))throw new Error('Invalid source path: '+path);const plain=new Uint8Array(await f.arrayBuffer()),object=randomName(),encrypted=await encrypt(plain,key);manifest.files[path]={object,type:mime(path),size:plain.length,sha256:await sha256(plain)};zip.push({name:'bp/'+object,data:encrypted})}status.textContent='Encrypting index.bp1...';const indexPlain=enc.encode(JSON.stringify(manifest,null,2)),indexEncrypted=await encrypt(indexPlain,key);zip.unshift({name:'index.bp1',data:indexEncrypted});const blob=new Blob([zipStore(zip)],{type:'application/zip'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(name.replace(/[^a-z0-9._-]+/gi,'-')||'bp1-site')+'.zip';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000);status.textContent=`Done.\n${files.length} website files encrypted.\nUpload index.bp1 and the bp/ folder from the ZIP to a public GitHub repository.`}catch(e){console.error(e);status.textContent=e.message||String(e)}finally{btn.disabled=false}};
</script></body></html>
